      --cream: #faf8f0;

      --shadow: 0 8px 32px rgba(0,0,0,0.08);

    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* --- HEADER --- */
    header {

      padding: 50px 30px 40px;
      text-align: center;
      border-radius: var(--radius);
      margin-bottom: 32px;
      box-shadow: 0 8px 40px rgba(13,110,61,0.25);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -60%; right: -20%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -40%; left: -10%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    header .icon {
      font-size: 3em;
      margin-bottom: 4px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    header .logo {
      height: 80px;
      width: auto;
      margin-bottom: 8px;
      border-radius: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6em;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      position: relative;
      z-index: 1;
    }
    header h1 span { color: var(--gold-light); }
    header p {
      opacity: 0.9;
      font-size: 1.05em;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }
    header .sub {
      display: inline-block;
      margin-top: 14px;
      font-size: 0.85em;
      opacity: 0.7;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 20px;
      border-radius: 30px;
      position: relative;
      z-index: 1;
    }
    header .credit {
      margin-top: 18px;
      font-size: 0.8em;
      opacity: 0.6;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 14px;
      display: inline-block;
    }

    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls-row .search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .controls-row .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #999;
      pointer-events: none;
    }
    .controls-row input {
      width: 100%;
      padding: 14px 18px 14px 44px;
      border: 2px solid #e0e0e0;
      border-radius: var(--radius-sm);
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
      background: white;
      font-family: 'Inter', sans-serif;
    }
    .controls-row input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(13,110,61,0.12);
    }
    .controls-row input::placeholder { color: #aaa; }
    .controls-row select {
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: var(--radius-sm);
      font-size: 15px;
      outline: none;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 140px;
      font-family: 'Inter', sans-serif;
      color: #333;
    }
    .controls-row select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(13,110,61,0.12);
    }

    /* --- FILTER BUTTONS --- */
    .filter-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filter-btns button {
      padding: 10px 24px;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      letter-spacing: 0.3px;
      font-family: 'Inter', sans-serif;
    }
    .filter-btns button:hover {
      background: rgba(13,110,61,0.06);
      transform: translateY(-1px);
    }
    .filter-btns button.active {
      background: linear-gradient(135deg, var(--primary) 0%, #1a8a4a 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(13,110,61,0.3);
      border-color: transparent;
    }

    /* --- STATS --- */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stats-bar .count {
      color: #555;
      font-size: 0.95em;
      font-weight: 500;
    }
    .stats-bar .count strong { color: var(--primary); font-weight: 700; }
    .stats-bar .reset-btn {
      padding: 6px 16px;
      border: 1px solid #ddd;
      background: white;
      color: #888;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }
    .stats-bar .reset-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* --- GRID --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    /* --- CARD --- */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      border: 1px solid rgba(255,255,255,0.7);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary) 0%, #1a8a4a 100%);
      border-radius: 0 2px 2px 0;
    }
    .card::after {
      content: '';
      position: absolute;
      top: -50%; right: -50%;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 100% 0%, rgba(13,110,61,0.02) 0%, transparent 60%);
      pointer-events: none;
      transition: all 0.5s;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--shadow-hover);
    }
    .card:hover::after {
      top: 0; right: 0;
    }
    .card .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card .name {
      font-size: 1.35em;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.3px;
    }
    .card .gender {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.72em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .card .gender.boy {
      background: linear-gradient(135deg, #d4edda, #c3e6cb);
      color: #155724;
    }
    .card .gender.girl {
      background: linear-gradient(135deg, #f8d7da, #f5c6cb);
      color: #721c24;
    }
    .card .arabic {
      margin-top: 10px;
      font-size: 1.7em;
      font-family: 'Amiri', 'Traditional Arabic', serif;
      direction: rtl;
      color: var(--primary);
      line-height: 1.4;
    }
    .card .meaning {
      margin-top: 10px;
      color: #444;
      line-height: 1.6;
      font-size: 0.95em;
    }
    .card .meaning-ur {
      margin-top: 6px;
      color: #333;
      line-height: 1.8;
      font-size: 1.2em;
      direction: rtl;
      font-family: 'Noto Nastaliq Urdu', 'Traditional Arabic', 'Iranian Sans', serif;
      background: rgba(13,110,61,0.04);
      padding: 6px 12px;
      border-radius: 8px;
    }
    .card .origin {
      margin-top: 10px;
      font-size: 0.82em;
      color: #999;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card .origin::before {
      content: '';
      display: inline-block;
      width: 4px; height: 4px;
      background: var(--gold);
      border-radius: 50%;
    }

    /* --- NO RESULTS --- */
    .no-results {
      text-align: center;
      padding: 80px 20px;
      color: #aaa;
      font-size: 1.1em;
      grid-column: 1 / -1;
    }
    .no-results .emoji { font-size: 2.5em; display: block; margin-bottom: 12px; }

    /* --- ANIMATIONS --- */
    .fade-in {
      animation: cardIn 0.5s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .fade-in:nth-child(1) { animation-delay: 0s; }
    .fade-in:nth-child(2) { animation-delay: 0.04s; }
    .fade-in:nth-child(3) { animation-delay: 0.08s; }
    .fade-in:nth-child(4) { animation-delay: 0.12s; }
    .fade-in:nth-child(5) { animation-delay: 0.16s; }
    .fade-in:nth-child(6) { animation-delay: 0.20s; }
    .fade-in:nth-child(7) { animation-delay: 0.24s; }
    .fade-in:nth-child(8) { animation-delay: 0.28s; }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      header { padding: 32px 20px 28px; }
      header h1 { font-size: 1.8em; }
      header .icon { font-size: 2.2em; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .controls-row { flex-direction: column; }
      .controls-row .search-wrap { min-width: 100%; }
      .controls-row select { min-width: 100%; }
      .card { padding: 18px; }
      .card .name { font-size: 1.2em; }
      .card .arabic { font-size: 1.4em; }
      .stats-bar { flex-direction: column; align-items: flex-start; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* --- SCROLLBAR --- */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

    /* --- LOADING SHIMMER --- */
    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* --- BADGE --- */
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), #d4b86a);
      color: #fff;
      font-size: 0.65em;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>

    const boyNames = names.filter(n => n.gender === "boy");
    const girlNames = names.filter(n => n.gender === "girl");

    let currentFilter = "all";

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("letterFilter").value = "";
      setFilter("all");
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btns button").forEach(b => b.classList.remove("active"));
      document.querySelector('[data-filter="' + filter + '"]').classList.add("active");
      render();
    }

    function render() {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const letter = document.getElementById("letterFilter").value;
      let filtered = names;

      if (currentFilter === "boy") filtered = boyNames;
      else if (currentFilter === "girl") filtered = girlNames;

      if (search) {
        filtered = filtered.filter(n =>
          n.name.toLowerCase().includes(search) ||
          n.meaning_en.toLowerCase().includes(search) ||
          n.meaning_ur.includes(search) ||
          n.origin.toLowerCase().includes(search)
        );
      }

      if (letter) {
        filtered = filtered.filter(n => n.name.startsWith(letter));
      }

      const grid = document.getElementById("grid");
      document.getElementById("stats").innerHTML = "Showing <strong>" + filtered.length + "</strong> of <strong>" + names.length + "</strong> names";

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">No names found. Try a different search.</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(n, i) {
        var delay = (i % 8) * 0.04;
        return '<div class="card fade-in" style="animation-delay:' + delay + 's">' +
          '<div class="card-top">' +
            '<div class="name">' + n.name + '</div>' +
            '<span class="gender ' + n.gender + '">' + (n.gender === "boy" ? "Boy" : "Girl") + '</span>' +
          '</div>' +
          '<div class="arabic">' + n.arabic + '</div>' +
          '<div class="meaning">' + n.meaning_en + '</div>' +
          '<div class="meaning-ur">' + n.meaning_ur + '</div>' +
          '<div class="origin">Origin: ' + n.origin + '</div>' +
        '</div>';
      }).join("");
    }

    function populateLetterFilter() {
      const letters = [...new Set(names.map(n => n.name[0]))].sort();
      const select = document.getElementById("letterFilter");
      letters.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        select.appendChild(opt);
      });
    }

    populateLetterFilter();
    render();
  </script>
